# Isolated public demo. Do not attach this file to api.advisortrack.co.za
# or portal.advisortrack.co.za. SSL is added with certbot after DNS exists:
#   sudo certbot --nginx -d demo.advisortrack.co.za

server {
    listen 80;
    listen [::]:80;
    server_name demo.advisortrack.co.za;

    root /home/ubuntu/advisortrack_demo_dashboard/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

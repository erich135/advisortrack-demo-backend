# Nginx reverse proxy for AdvisorTrack API
# Install: sudo cp deploy/nginx-api.advisortrack.co.za.conf /etc/nginx/sites-available/advisortrack-api
#          sudo ln -sf /etc/nginx/sites-available/advisortrack-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d api.advisortrack.co.za

server {
    listen 80;
    listen [::]:80;
    server_name api.advisortrack.co.za;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
